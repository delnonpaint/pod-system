<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ส่งหลักฐานการจัดส่ง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2430; --ink-soft:#2C3847; --paper:#F6F4EE; --paper-card:#FFFFFF;
    --amber:#E8960A; --amber-deep:#C97C05; --stamp-green:#2E6B4F; --slate:#6B7680;
    --line:#D9D4C6; --danger:#B3432E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);font-family:'Inter',system-ui,sans-serif;color:var(--ink);min-height:100vh;padding-bottom:110px;}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px;}
  .brandbar{display:flex;align-items:center;gap:10px;padding:14px 4px 20px;}
  .brandmark{width:38px;height:38px;border-radius:8px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brandmark svg{width:20px;height:20px;}
  .brandtext{line-height:1.15;}
  .brandtext .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber-deep);font-weight:600;}
  .brandtext h1{font-family:'Oswald',sans-serif;font-weight:600;font-size:20px;margin:1px 0 0;letter-spacing:.01em;}
  .slip{position:relative;background:var(--paper-card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(27,36,48,.04),0 8px 24px -12px rgba(27,36,48,.12);overflow:hidden;}
  .slip::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:repeating-linear-gradient(90deg,var(--amber) 0 14px,transparent 14px 24px);opacity:.9;}
  .slip-inner{padding:22px 18px 20px;}
  .tag{position:absolute;top:14px;right:-1px;background:var(--ink);color:var(--paper);font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px 5px 14px;border-radius:6px 0 0 6px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field label .opt{font-weight:500;color:var(--slate);font-size:12px;}
  .field label .req{color:var(--danger);margin-left:2px;}
  .field input[type=text],.field input[type=date],.field textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px 13px;font-size:15.5px;font-family:'Inter',sans-serif;background:#FCFBF8;color:var(--ink);transition:border-color .15s ease,background .15s ease;}
  .field input[type=text]:focus,.field input[type=date]:focus,.field textarea:focus{outline:none;border-color:var(--amber);background:#fff;}
  #billNo{font-family:'IBM Plex Mono',monospace;font-weight:600;letter-spacing:.02em;}
  .field textarea{resize:vertical;min-height:64px;line-height:1.45;}
  .photogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
  .pslot{aspect-ratio:1/1;border-radius:10px;border:1.5px dashed var(--line);background:#FCFBF8;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .pslot:active{background:#F2EFE7;}
  .pslot .plus{color:var(--slate);display:flex;flex-direction:column;align-items:center;gap:3px;}
  .pslot .plus span{font-size:10.5px;font-weight:600;font-family:'IBM Plex Mono',monospace;}
  .pslot img{width:100%;height:100%;object-fit:cover;display:block;}
  .pslot .rm{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(27,36,48,.75);color:#fff;border:none;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;cursor:pointer;}
  .photocount{margin-top:8px;font-size:12px;color:var(--slate);font-family:'IBM Plex Mono',monospace;}
  .errmsg{font-size:13px;color:var(--danger);background:#FBEDE9;border:1px solid #EFC9BE;border-radius:8px;padding:9px 11px;margin-bottom:16px;display:none;}
  .errmsg.show{display:block;}
  .submitbar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(246,244,238,0) 0%,var(--paper) 30%);padding:22px 16px 18px;}
  .submitbar-inner{max-width:520px;margin:0 auto;}
  #submitBtn{width:100%;border:none;border-radius:12px;background:var(--ink);color:#fff;font-family:'Oswald',sans-serif;font-size:16.5px;font-weight:600;letter-spacing:.03em;padding:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 6px 18px -6px rgba(27,36,48,.4);transition:transform .1s ease,background .15s ease;}
  #submitBtn:active{transform:scale(.98);}
  #submitBtn:disabled{background:#A8ADB4;cursor:not-allowed;box-shadow:none;}
  .spinner{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite;display:none;}
  .spinner.show{display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .successwrap{display:none;text-align:center;padding:50px 10px 30px;}
  .successwrap.show{display:block;}
  .mainform.hide{display:none;}
  .stamp{width:150px;height:150px;margin:0 auto 22px;border-radius:50%;border:4px solid var(--stamp-green);color:var(--stamp-green);display:flex;align-items:center;justify-content:center;transform:rotate(-9deg) scale(0);animation:stampin .5s cubic-bezier(.2,1.6,.4,1) forwards;position:relative;}
  .stamp::after{content:"";position:absolute;inset:8px;border-radius:50%;border:1.5px solid var(--stamp-green);opacity:.6;}
  .stamp .stxt{font-family:'Oswald',sans-serif;font-weight:700;font-size:19px;letter-spacing:.04em;line-height:1.25;}
  @keyframes stampin{0%{transform:rotate(-20deg) scale(2.4);opacity:0;}60%{opacity:1;}100%{transform:rotate(-9deg) scale(1);opacity:1;}}
  .successwrap h2{font-family:'Oswald',sans-serif;font-size:22px;margin:0 0 6px;}
  .successwrap p{color:var(--slate);font-size:14.5px;margin:0 0 4px;}
  .refcode{display:inline-block;margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:13px;background:var(--ink);color:var(--paper);padding:6px 14px;border-radius:7px;letter-spacing:.05em;}
  .again{margin-top:26px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;padding:12px 22px;border-radius:10px;cursor:pointer;}
  .again:active{background:var(--ink);color:#fff;}
  .foot{text-align:center;margin-top:18px;font-size:11.5px;color:var(--slate);}

  /* login screen */
  .loginwrap{max-width:400px;margin:0 auto;padding:60px 16px 40px;display:none;}
  .loginwrap.show{display:block;}
  .app.hide{display:none;}
  .loginbrand{text-align:center;margin-bottom:28px;}
  .loginbrand .mk{width:56px;height:56px;border-radius:12px;background:var(--ink);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;}
  .loginbrand .mk svg{width:30px;height:30px;}
  .loginbrand .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber-deep);font-weight:600;}
  .loginbrand h1{font-family:'Oswald',sans-serif;font-weight:600;font-size:23px;margin:2px 0 0;}
  .logincard{background:var(--paper-card);border:1px solid var(--line);border-radius:14px;padding:24px 20px;box-shadow:0 1px 2px rgba(27,36,48,.04),0 8px 24px -12px rgba(27,36,48,.12);}
  .logincard .field{margin-bottom:16px;}
  .logincard label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .logincard input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px 13px;font-size:15.5px;font-family:'Inter',sans-serif;background:#FCFBF8;color:var(--ink);}
  .logincard input:focus{outline:none;border-color:var(--amber);background:#fff;}
  #loginBtn{width:100%;border:none;border-radius:12px;background:var(--ink);color:#fff;font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;letter-spacing:.03em;padding:14px;cursor:pointer;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:9px;}
  #loginBtn:active{transform:scale(.98);}
  #loginBtn:disabled{background:#A8ADB4;cursor:not-allowed;}
  .loginerr{font-size:13px;color:var(--danger);background:#FBEDE9;border:1px solid #EFC9BE;border-radius:8px;padding:9px 11px;margin-bottom:16px;display:none;}
  .loginerr.show{display:block;}

  /* logged-in header (who am I + logout) */
  .userbar{display:flex;align-items:center;justify-content:space-between;background:var(--paper-card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:16px;}
  .userbar .who{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink-soft);}
  .userbar .who svg{color:var(--stamp-green);}
  .logoutBtn{background:none;border:none;color:var(--slate);font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;text-decoration:underline;padding:4px;}
  #carrierName[readonly]{background:#F2EFE7;color:var(--ink-soft);cursor:not-allowed;}
</style>
</head>
<body>

<!-- ===== หน้าเข้าสู่ระบบ ===== -->
<div class="loginwrap" id="loginwrap">
  <div class="loginbrand">
    <div class="mk">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 7L12 3L21 7V17L12 21L3 17V7Z" stroke="#F6F4EE" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 7L12 11L21 7" stroke="#E8960A" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 11V21" stroke="#F6F4EE" stroke-width="1.6"/></svg>
    </div>
    <div class="eyebrow">Proof of Delivery</div>
    <h1>เข้าสู่ระบบขนส่ง</h1>
  </div>
  <div class="logincard">
    <div class="loginerr" id="loginErr"></div>
    <div class="field">
      <label>ชื่อผู้ใช้</label>
      <input type="text" id="loginUser" autocomplete="username" placeholder="ชื่อผู้ใช้">
    </div>
    <div class="field">
      <label>รหัสผ่าน</label>
      <input type="password" id="loginPass" autocomplete="current-password" placeholder="รหัสผ่าน">
    </div>
    <button id="loginBtn" type="button">
      <span class="spinner" id="loginSpinner"></span>
      <span id="loginLabel">เข้าสู่ระบบ</span>
    </button>
  </div>
  <div class="foot">ติดต่อผู้ดูแลระบบหากลืมรหัสผ่าน หรือยังไม่มีบัญชี</div>
</div>

<!-- ===== แอปหลัก (แสดงหลังเข้าสู่ระบบ) ===== -->
<div class="app hide" id="app">
<div class="wrap">
  <div class="brandbar">
    <div class="brandmark">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 7L12 3L21 7V17L12 21L3 17V7Z" stroke="#F6F4EE" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 7L12 11L21 7" stroke="#E8960A" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 11V21" stroke="#F6F4EE" stroke-width="1.6"/></svg>
    </div>
    <div class="brandtext">
      <div class="eyebrow">Proof of Delivery</div>
      <h1>ส่งหลักฐานการจัดส่ง</h1>
    </div>
  </div>

  <div class="userbar">
    <div class="who">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M4 20C4 16.6863 7.58172 14 12 14C16.4183 14 20 16.6863 20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span id="whoami">-</span>
    </div>
    <button class="logoutBtn" id="logoutBtn" type="button">ออกจากระบบ</button>
  </div>

  <div class="slip">
    <div class="tag" id="topTag">รอกรอกข้อมูล</div>
    <div class="slip-inner">
      <div id="errBox" class="errmsg"></div>
      <form id="mainform" class="mainform">
        <div class="field">
          <label>ชื่อขนส่ง <span class="req">*</span></label>
          <input type="text" id="carrierName" placeholder="ชื่อขนส่ง" autocomplete="off" readonly>
        </div>
        <div class="field">
          <label>เลขที่บิล <span class="req">*</span></label>
          <input type="text" id="billNo" placeholder="เช่น 500XXXXXXX" autocomplete="off">
        </div>
        <div class="field">
          <label>วันที่ส่งงาน <span class="req">*</span></label>
          <input type="date" id="deliveryDate">
        </div>
        <div class="field">
          <label>รูปถ่ายหลักฐานการส่งงาน <span class="req">*</span> <span class="opt">(สูงสุด 5 รูป)</span></label>
          <div class="photogrid" id="photogrid"></div>
          <div class="photocount" id="photocount">0 / 5 รูป</div>
          <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
        </div>
        <div class="field" style="margin-bottom:4px;">
          <label>หมายเหตุ <span class="opt">(ถ้ามี)</span></label>
          <textarea id="note" placeholder="เช่น สินค้าเสียหาย, ลูกค้าไม่สะดวกรับ"></textarea>
        </div>
      </form>

      <div class="successwrap" id="successwrap">
        <div class="stamp"><div class="stxt">ส่ง<br>สำเร็จ</div></div>
        <h2>บันทึกหลักฐานเรียบร้อย</h2>
        <p>ข้อมูลถูกเก็บเข้าระบบกลางแล้ว</p>
        <div class="refcode" id="refcode"></div>
        <div><button class="again" id="againBtn" type="button">ส่งงานอีกใบ</button></div>
      </div>
    </div>
  </div>
  <div class="foot">ข้อมูลของคุณจะถูกจัดเก็บไว้ในระบบกลางที่ทีมงานเข้าถึงได้</div>
</div>

<div class="submitbar" id="submitbar">
  <div class="submitbar-inner">
    <button id="submitBtn" type="button">
      <span class="spinner" id="spinner"></span>
      <span id="submitLabel">ส่งหลักฐานการจัดส่ง</span>
    </button>
  </div>
</div>
</div><!-- /.app -->

<script>
// ===================================================================
//  ตั้งค่า URL ของ Google Apps Script Web App ตรงนี้ (ดูคู่มือตั้งค่า.md)
// ===================================================================
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyjAzhd7EvO3hEmFBagEZ0VvIdCuUSw-S2D1iwj2X-tbLNaHXuCIuo9Z6d0Kru0yUme/exec";

const MAX_PHOTOS = 5;
let photos = [];

const grid = document.getElementById('photogrid');
const fileInput = document.getElementById('fileInput');
const photocount = document.getElementById('photocount');
const errBox = document.getElementById('errBox');
const carrierName = document.getElementById('carrierName');
const billNo = document.getElementById('billNo');
const deliveryDate = document.getElementById('deliveryDate');
const note = document.getElementById('note');
const topTag = document.getElementById('topTag');

// ===== สถานะการเข้าสู่ระบบ =====
let session = null; // { username, password, carrier }
const loginwrap = document.getElementById('loginwrap');
const appEl = document.getElementById('app');
const loginUser = document.getElementById('loginUser');
const loginPass = document.getElementById('loginPass');
const loginBtn = document.getElementById('loginBtn');
const loginErr = document.getElementById('loginErr');
const loginSpinner = document.getElementById('loginSpinner');
const loginLabel = document.getElementById('loginLabel');
const whoami = document.getElementById('whoami');

deliveryDate.value = new Date().toISOString().slice(0,10);

function showError(msg){ errBox.textContent = msg; errBox.classList.add('show'); errBox.scrollIntoView({behavior:'smooth',block:'center'}); }
function clearError(){ errBox.classList.remove('show'); errBox.textContent=''; }

function renderGrid(){
  grid.innerHTML = '';
  for(let i=0;i<MAX_PHOTOS;i++){
    const slot = document.createElement('div');
    slot.className = 'pslot';
    if(photos[i]){
      const img = document.createElement('img'); img.src = photos[i]; slot.appendChild(img);
      const rm = document.createElement('button'); rm.className='rm'; rm.type='button'; rm.innerHTML='&times;';
      rm.onclick = (e)=>{ e.stopPropagation(); photos.splice(i,1); renderGrid(); };
      slot.appendChild(rm);
    } else if(i === photos.length){
      slot.innerHTML = '<div class="plus"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="#6B7680" stroke-width="2" stroke-linecap="round"/></svg><span>ถ่าย/แนบ</span></div>';
      slot.onclick = ()=> fileInput.click();
    } else { slot.style.opacity='.4'; slot.style.cursor='default'; }
    grid.appendChild(slot);
  }
  photocount.textContent = photos.length + ' / ' + MAX_PHOTOS + ' รูป';
}
renderGrid();

fileInput.addEventListener('change', (e) => {
  const files = Array.from(e.target.files || []);
  if(files.length === 0) return;
  const slotsLeft = MAX_PHOTOS - photos.length;
  const toProcess = files.slice(0, slotsLeft);
  Promise.all(toProcess.map(f => compressImage(f).catch(()=>null))).then(results => {
    results.forEach(d => { if(d && photos.length < MAX_PHOTOS){ photos.push(d); } });
    renderGrid();
    if(results.some(r => r === null)){ showError('บางรูปไม่สามารถอ่านได้ กรุณาลองใหม่'); }
    fileInput.value = '';
  });
});

function compressImage(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const MAX_DIM = 1400;
        let w = img.width, h = img.height;
        if(w > h && w > MAX_DIM){ h = Math.round(h*MAX_DIM/w); w = MAX_DIM; }
        else if(h > MAX_DIM){ w = Math.round(w*MAX_DIM/h); h = MAX_DIM; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function updateTag(){ topTag.textContent = billNo.value.trim() ? ('บิล ' + billNo.value.trim()) : 'รอกรอกข้อมูล'; }
billNo.addEventListener('input', updateTag);

// ---- JSONP: อ่าน/ยืนยันข้อมูล (ไม่ติด CORS) ----
function jsonp(url, params){
  return new Promise((resolve, reject) => {
    const cbName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('หมดเวลารอการตอบกลับ')); }, 15000);
    function cleanup(){ delete window[cbName]; script.remove(); clearTimeout(timer); }
    window[cbName] = (data) => { cleanup(); resolve(data); };
    const qs = new URLSearchParams(Object.assign({}, params, { callback: cbName })).toString();
    script.src = url + '?' + qs;
    script.onerror = () => { cleanup(); reject(new Error('เชื่อมต่อ Backend ไม่สำเร็จ')); };
    document.body.appendChild(script);
  });
}

// ---- ระบบเข้าสู่ระบบ ----
const SESSION_KEY = 'pod_session';

function showLoginErr(msg){ loginErr.textContent = msg; loginErr.classList.add('show'); }
function clearLoginErr(){ loginErr.classList.remove('show'); loginErr.textContent=''; }

function enterApp(sess){
  session = sess;
  whoami.textContent = sess.carrier;
  carrierName.value = sess.carrier;
  loginwrap.classList.remove('show');
  appEl.classList.remove('hide');
}

function doLogout(){
  session = null;
  try { sessionStorage.removeItem(SESSION_KEY); } catch(e){}
  loginUser.value=''; loginPass.value=''; clearLoginErr();
  appEl.classList.add('hide');
  loginwrap.classList.add('show');
}

async function doLogin(){
  clearLoginErr();
  const u = loginUser.value.trim();
  const pw = loginPass.value;
  if(!u || !pw){ showLoginErr('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน'); return; }
  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('script.google.com') === -1){
    showLoginErr('ยังไม่ได้ตั้งค่า Backend (ดูคู่มือตั้งค่า.md)'); return;
  }
  loginBtn.disabled = true; loginSpinner.classList.add('show'); loginLabel.textContent='กำลังตรวจสอบ...';
  try {
    const res = await jsonp(APPS_SCRIPT_URL, { action: 'login', username: u, password: pw });
    if(res && res.success){
      const sess = { username: u, password: pw, carrier: res.carrier };
      try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(sess)); } catch(e){}
      enterApp(sess);
    } else {
      showLoginErr((res && res.error) ? res.error : 'เข้าสู่ระบบไม่สำเร็จ');
    }
  } catch(err){
    showLoginErr('เชื่อมต่อไม่สำเร็จ กรุณาลองใหม่');
  } finally {
    loginBtn.disabled = false; loginSpinner.classList.remove('show'); loginLabel.textContent='เข้าสู่ระบบ';
  }
}

loginBtn.addEventListener('click', doLogin);
loginPass.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') doLogin(); });
document.getElementById('logoutBtn').addEventListener('click', doLogout);

// กู้คืน session ถ้าเคยเข้าสู่ระบบไว้ (ในแท็บเดียวกัน)
(function restoreSession(){
  try {
    const saved = sessionStorage.getItem(SESSION_KEY);
    if(saved){ enterApp(JSON.parse(saved)); }
  } catch(e){}
})();

// ---- ส่งข้อมูลบันทึก: fetch แบบ no-cors (ส่งได้ แต่อ่านผลไม่ได้ จึงยืนยันด้วย JSONP) ----
function sendData(url, payload){
  return fetch(url, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
}

const submitBtn = document.getElementById('submitBtn');
const spinner = document.getElementById('spinner');
const submitLabel = document.getElementById('submitLabel');

submitBtn.addEventListener('click', async () => {
  clearError();
  if(!session){ showError('กรุณาเข้าสู่ระบบก่อน'); doLogout(); return; }
  const bill = billNo.value.trim();
  const date = deliveryDate.value;

  if(!bill){ showError('กรุณากรอกเลขที่บิล'); billNo.focus(); return; }
  if(!date){ showError('กรุณาเลือกวันที่ส่งงาน'); deliveryDate.focus(); return; }
  if(photos.length === 0){ showError('กรุณาแนบรูปภาพหลักฐานอย่างน้อย 1 รูป'); return; }
  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('script.google.com') === -1){
    showError('ยังไม่ได้ตั้งค่า Backend — กรุณาใส่ APPS_SCRIPT_URL ในไฟล์นี้ก่อน (ดูคู่มือตั้งค่า.md)');
    return;
  }

  submitBtn.disabled = true;
  spinner.classList.add('show');
  submitLabel.textContent = 'กำลังส่งข้อมูล...';

  try {
    // 1) ส่งข้อมูล (no-cors: อ่านผลไม่ได้ แต่ข้อมูลถูกส่งถึง Backend)
    //    ส่ง username/password ไปด้วย เพื่อให้ Backend ยืนยันตัวตน + ใช้ชื่อขนส่งจากบัญชี
    await sendData(APPS_SCRIPT_URL, {
      action: 'submit',
      username: session.username, password: session.password,
      billNo: bill, deliveryDate: date, note: note.value.trim(), images: photos
    });

    // 2) ยืนยันด้วย JSONP ว่าแถวถูกบันทึกจริง + ดึงเลขอ้างอิง (ลองซ้ำเผื่อ Backend ยังประมวลผลอยู่)
    let refCode = null;
    const delays = [1500, 2500, 3500, 4500, 5500, 6500];
    for(let i = 0; i < delays.length && !refCode; i++){
      await new Promise(r => setTimeout(r, delays[i]));
      submitLabel.textContent = 'กำลังยืนยันข้อมูล (' + (i+1) + '/' + delays.length + ')...';
      try {
        const res = await jsonp(APPS_SCRIPT_URL, { action: 'search', billNo: bill });
        const match = (res.results || []).find(r => String(r.billNo).trim() === String(bill).trim());
        if(match){ refCode = match.refCode; }
      } catch(err){ console.warn('confirm attempt ' + i + ':', err); }
    }

    if(!refCode){ throw new Error('ไม่พบข้อมูลที่เพิ่งส่งในระบบ อาจบันทึกไม่สำเร็จ กรุณาลองใหม่'); }

    document.getElementById('refcode').textContent = 'อ้างอิง: ' + refCode;
    document.getElementById('mainform').classList.add('hide');
    document.getElementById('submitbar').style.display = 'none';
    document.getElementById('successwrap').classList.add('show');

  } catch(err){
    console.error('Save failed:', err);
    showError('บันทึกไม่สำเร็จ: ' + err.message);
  } finally {
    submitBtn.disabled = false;
    spinner.classList.remove('show');
    submitLabel.textContent = 'ส่งหลักฐานการจัดส่ง';
  }
});

document.getElementById('againBtn').addEventListener('click', () => {
  billNo.value=''; deliveryDate.value=new Date().toISOString().slice(0,10);
  note.value=''; photos=[]; renderGrid(); updateTag();
  if(session){ carrierName.value = session.carrier; } // คงชื่อขนส่งที่ล็อกอินไว้
  document.getElementById('mainform').classList.remove('hide');
  document.getElementById('submitbar').style.display='block';
  document.getElementById('successwrap').classList.remove('show');
  window.scrollTo({top:0,behavior:'smooth'});
});
</script>
</body>
</html>
