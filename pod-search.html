<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ค้นหาหลักฐานการจัดส่ง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#47424E; --ink-soft:#6B6572; --paper:#F7F2F4; --paper-card:#FFFFFF;
    --amber:#F2B8A2; --amber-deep:#C46A52; --stamp-green:#4E8A72; --slate:#8B8592;
    --line:#ECE5E8; --danger:#C25E48;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);font-family:'Inter',system-ui,sans-serif;color:var(--ink);min-height:100vh;}
  .wrap{max-width:760px;margin:0 auto;padding:22px 16px 60px;}
  .brandbar{display:flex;align-items:center;gap:10px;padding:6px 4px 22px;}
  .brandmark{width:38px;height:38px;border-radius:8px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
  .brandmark svg{width:20px;height:20px;}
  .brandmark img.brandlogo,.loginbrand .mk img.brandlogo{width:100%;height:100%;object-fit:contain;padding:3px;background:#fff;}
  .brandtext .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber-deep);font-weight:600;}
  .brandtext h1{font-family:'Oswald',sans-serif;font-weight:600;font-size:20px;margin:1px 0 0;}

  /* userbar */
  .userbar{display:flex;align-items:center;justify-content:space-between;background:var(--paper-card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:16px;}
  .userbar .who{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink-soft);}
  .userbar .who svg{color:var(--stamp-green);}
  .logoutBtn{background:none;border:none;color:var(--slate);font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;text-decoration:underline;padding:4px;}

  .searchcard{background:var(--paper-card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(71,66,78,.04),0 8px 24px -12px rgba(71,66,78,.12);margin-bottom:22px;}
  .searchrow{display:flex;gap:10px;align-items:center;}
  .searchrow svg{flex-shrink:0;color:var(--slate);}
  #searchInput{flex:1;border:none;outline:none;font-size:17px;font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--ink);background:transparent;letter-spacing:.01em;}
  #searchInput::placeholder{color:#B7AEB6;font-family:'Inter',sans-serif;font-weight:500;}
  .clearbtn{background:none;border:none;color:var(--slate);font-size:18px;cursor:pointer;display:none;padding:4px;}
  .clearbtn.show{display:block;}
  .searchmeta{margin-top:10px;font-size:12.5px;color:var(--slate);font-family:'IBM Plex Mono',monospace;padding-left:2px;}
  .resultsLabel{font-size:12.5px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px 4px;}
  .rowcard{background:var(--paper-card);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:9px;cursor:pointer;display:flex;align-items:center;gap:13px;transition:border-color .12s ease,transform .08s ease;}
  .rowcard:active{transform:scale(.99);}
  .rowcard:hover{border-color:var(--amber);}
  .rowicon{width:38px;height:38px;border-radius:8px;background:#F5ECEF;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12px;}
  .rowmain{flex:1;min-width:0;}
  .rowbill{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;color:var(--ink);}
  .rowsub{font-size:13px;color:var(--slate);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rowarrow{color:var(--slate);flex-shrink:0;}
  .empty{text-align:center;padding:60px 20px;color:var(--slate);}
  .empty svg{margin-bottom:14px;opacity:.5;}
  .empty p{font-size:14.5px;margin:0;}
  .empty .sub{font-size:13px;margin-top:5px;color:#B0A8B0;}
  .loading{text-align:center;padding:50px 20px;color:var(--slate);font-size:14px;}
  .spinner{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--amber-deep);animation:spin .7s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .overlay{display:none;position:fixed;inset:0;background:rgba(71,66,78,.5);z-index:50;padding:0;align-items:flex-end;justify-content:center;}
  .overlay.show{display:flex;}
  @media(min-width:640px){.overlay{align-items:center;padding:20px;}}
  .modal{background:var(--paper-card);width:100%;max-width:600px;border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;position:relative;}
  @media(min-width:640px){.modal{border-radius:16px;}}
  .modal::before{content:"";display:block;height:5px;background:repeating-linear-gradient(90deg,var(--amber) 0 14px,transparent 14px 24px);}
  .modalhead{padding:18px 20px 4px;position:relative;}
  .closeBtn{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:#F5ECEF;border:none;color:var(--ink-soft);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .modalbill{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:20px;color:var(--ink);}
  .modalgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:6px 20px 4px;}
  .modalgrid img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer;}
  .detailrows{padding:14px 20px 4px;}
  .drow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F1EAED;font-size:14px;}
  .drow:last-child{border-bottom:none;}
  .drow .k{color:var(--slate);}
  .drow .v{font-weight:600;color:var(--ink);text-align:right;max-width:65%;}
  .notebox{margin:6px 20px 20px;background:#FBF6F8;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:13.5px;color:var(--ink-soft);line-height:1.5;}
  .notebox .lbl{font-size:11px;color:var(--slate);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:4px;}
  .lightbox{display:none;position:fixed;inset:0;background:rgba(40,36,44,.95);z-index:60;align-items:center;justify-content:center;flex-direction:column;padding:0;}
  .lightbox.show{display:flex;}
  .lbviewport{position:relative;width:100%;flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none;}
  .lbviewport img{max-width:100%;max-height:100%;border-radius:6px;transform-origin:0 0;user-select:none;-webkit-user-drag:none;will-change:transform;transition:transform .05s linear;}
  .lbviewport img.grabbing{cursor:grabbing;transition:none;}
  .lbviewport img.zoomable{cursor:zoom-in;}
  .lbviewport img.zoomed{cursor:grab;}
  .lbbar{flex-shrink:0;padding:14px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;}
  .lbcontrols{display:flex;gap:16px;align-items:center;}
  .lbbtn{background:rgba(255,255,255,.15);border:none;color:#fff;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;}
  .lbclose{position:absolute;top:18px;right:18px;background:rgba(255,255,255,.15);color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;}
  .lbcount{color:#D8D2D6;font-size:12.5px;font-family:'IBM Plex Mono',monospace;margin-top:10px;}

  /* login screen */
  .loginwrap{max-width:400px;margin:0 auto;padding:60px 16px 40px;display:none;}
  .loginwrap.show{display:block;}
  .app.hide{display:none;}
  .loginbrand{text-align:center;margin-bottom:28px;}
  .loginbrand .mk{width:56px;height:56px;border-radius:12px;background:var(--ink);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;overflow:hidden;}
  .loginbrand .mk svg{width:30px;height:30px;}
  .loginbrand .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber-deep);font-weight:600;}
  .loginbrand h1{font-family:'Oswald',sans-serif;font-weight:600;font-size:23px;margin:2px 0 0;}
  .logincard{background:var(--paper-card);border:1px solid var(--line);border-radius:14px;padding:24px 20px;box-shadow:0 1px 2px rgba(71,66,78,.04),0 8px 24px -12px rgba(71,66,78,.12);}
  .logincard .field{margin-bottom:16px;}
  .logincard label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .logincard input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px 13px;font-size:15.5px;font-family:'Inter',sans-serif;background:#FCFAFB;color:var(--ink);}
  .logincard input:focus{outline:none;border-color:var(--amber);background:#fff;}
  #loginBtn{width:100%;border:none;border-radius:12px;background:var(--ink);color:#fff;font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;letter-spacing:.03em;padding:14px;cursor:pointer;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:9px;}
  #loginBtn:active{transform:scale(.98);}
  #loginBtn:disabled{background:#B7B0BC;cursor:not-allowed;}
  .loginerr{font-size:13px;color:var(--danger);background:#FBEEEB;border:1px solid #EFC9C0;border-radius:8px;padding:9px 11px;margin-bottom:16px;display:none;}
  .loginerr.show{display:block;}
  .rememberrow{display:flex;align-items:center;gap:8px;margin:2px 0 16px;cursor:pointer;font-size:13.5px;color:var(--ink-soft);user-select:none;}
  .rememberrow input{width:17px;height:17px;accent-color:var(--amber-deep);cursor:pointer;}
  .spinner-sm{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite;display:none;}
  .spinner-sm.show{display:inline-block;}
  .foot{text-align:center;margin-top:18px;font-size:11.5px;color:var(--slate);}
</style>
</head>
<body>

<!-- ===== หน้าเข้าสู่ระบบ ===== -->
<div class="loginwrap" id="loginwrap">
  <div class="loginbrand">
    <div class="mk">
      <img class="brandlogo" src="logo.png" alt="TOA" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-flex';">
      <span style="display:none;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" fill="none"><path d="M3 7L12 3L21 7V17L12 21L3 17V7Z" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 7L12 11L21 7" stroke="#F2B8A2" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 11V21" stroke="#FFFFFF" stroke-width="1.6"/></svg></span>
    </div>
    <div class="eyebrow">Proof of Delivery</div>
    <h1>เข้าสู่ระบบ (ดูหลักฐาน)</h1>
  </div>
  <div class="logincard">
    <div class="loginerr" id="loginErr"></div>

      <label>รหัสผ่าน</label>

    </div>
    <label class="rememberrow">
      <input type="checkbox" id="rememberMe">
      <span>จำการเข้าสู่ระบบไว้ในเครื่องนี้</span>

    <button id="loginBtn" type="button">

      <span id="loginLabel">เข้าสู่ระบบ</span>

  <div class="foot">ติดต่อผู้ดูแลระบบหากลืมรหัสผ่าน หรือยังไม่มีบัญชี</div>
</div>

<!-- ===== แอปหลัก (แสดงหลังเข้าสู่ระบบ) ===== -->
<div class="app hide" id="app">
<div class="wrap">
  <div class="brandbar">
    <div class="brandmark">
      <img class="brandlogo" src="logo.png" alt="TOA" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <span style="display:none;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" fill="none"><path d="M3 7L12 3L21 7V17L12 21L3 17V7Z" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 7L12 11L21 7" stroke="#F2B8A2" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 11V21" stroke="#FFFFFF" stroke-width="1.6"/></svg></span>
    </div>
    <div class="brandtext">
      <div class="eyebrow">Proof of Delivery</div>
      <h1>ค้นหาหลักฐานการจัดส่ง</h1>
    </div>
  </div>

  <div class="userbar">
    <div class="who">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M4 20C4 16.6863 7.58172 14 12 14C16.4183 14 20 16.6863 20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span id="whoami">-</span>

    <button class="logoutBtn" id="logoutBtn" type="button">ออกจากระบบ</button>

  <div class="searchcard">
    <div class="searchrow">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="text" id="searchInput" placeholder="ค้นหาด้วยเลขที่บิล...">
      <button class="clearbtn" id="clearBtn" type="button">&times;</button>
    </div>
    <div class="searchmeta" id="searchMeta">กำลังโหลด...</div>

  <div id="resultsLabel" class="resultsLabel" style="display:none;"></div>

</div>
</div><!-- /.app -->

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modalhead">
      <button class="closeBtn" id="closeModal">&times;</button>
      <div class="modalbill" id="modalBill">-</div>
    </div>
    <div class="modalgrid" id="modalGrid"></div>
    <div class="detailrows" id="detailRows"></div>
    <div class="notebox" id="noteBox" style="display:none;">
      <div class="lbl">หมายเหตุจากขนส่ง</div>
      <div id="noteText"></div>

</div>

<div class="lightbox" id="lightbox">
  <button class="lbclose" id="lbClose">&times;</button>
  <div class="lbviewport" id="lbViewport">
    <img id="lbImg" src="" class="zoomable" alt="">
  </div>
  <div class="lbbar">
    <div class="lbcontrols">
      <button class="lbbtn" id="lbPrev" title="รูปก่อนหน้า">&#8249;</button>
      <button class="lbbtn" id="lbZoomOut" title="ซูมออก">&#8722;</button>
      <button class="lbbtn" id="lbZoomIn" title="ซูมเข้า">&#43;</button>
      <a id="lbDownload" download="proof.jpg" target="_blank"><button class="lbbtn" type="button" title="ดาวน์โหลด">&#8595;</button></a>
      <button class="lbbtn" id="lbNext" title="รูปถัดไป">&#8250;</button>
    </div>

<script>
// ===================================================================
//  ใส่ URL เดียวกับใน pod-submit.html (ดูคู่มือตั้งค่า.md)
// ===================================================================
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyNW-mdGKkp77K4xlgVLba-TSmar_VecxsFVDm-5_CeTqHfCIN0yqLWOPmmv292bOGLBg/exec";

let currentImages = [];
let currentImgIdx = 0;
let debounceTimer = null;

const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const searchMeta = document.getElementById('searchMeta');
const resultsArea = document.getElementById('resultsArea');
const resultsLabel = document.getElementById('resultsLabel');

function fmtDate(iso){ if(!iso) return '-'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return d.toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(iso){ if(!iso) return '-'; const d=new Date(iso); return d.toLocaleString('th-TH',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function backendConfigured(){ return APPS_SCRIPT_URL && APPS_SCRIPT_URL.indexOf('script.google.com') > -1; }

function jsonp(url, params){
  return new Promise((resolve, reject) => {
    const cbName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('หมดเวลารอการตอบกลับ')); }, 15000);
    function cleanup(){ delete window[cbName]; script.remove(); clearTimeout(timer); }
    window[cbName] = (data) => { cleanup(); resolve(data); };
    const qs = new URLSearchParams(Object.assign({}, params, { callback: cbName })).toString();
    script.src = url + '?' + qs;
    script.onerror = () => { cleanup(); reject(new Error('เชื่อมต่อ Backend ไม่สำเร็จ')); };
    document.body.appendChild(script);
  });
}
async function callBackend(params){
  const data = await jsonp(APPS_SCRIPT_URL, params);
  if(!data || !data.success){ throw new Error((data && data.error) || 'เรียกข้อมูลไม่สำเร็จ'); }
  return data.results || [];
}

// ===== ระบบเข้าสู่ระบบ =====
let session = null;
const SESSION_KEY = 'pod_viewer_session';
const loginwrap = document.getElementById('loginwrap');
const appEl = document.getElementById('app');
const loginUser = document.getElementById('loginUser');
const loginPass = document.getElementById('loginPass');
const loginBtn = document.getElementById('loginBtn');
const loginErr = document.getElementById('loginErr');
const loginSpinner = document.getElementById('loginSpinner');
const loginLabel = document.getElementById('loginLabel');
const whoami = document.getElementById('whoami');
const rememberMe = document.getElementById('rememberMe');

function showLoginErr(msg){ loginErr.textContent = msg; loginErr.classList.add('show'); }
function clearLoginErr(){ loginErr.classList.remove('show'); loginErr.textContent=''; }

function enterApp(sess){
  session = sess;
  whoami.textContent = sess.carrier;
  loginwrap.classList.remove('show');
  appEl.classList.remove('hide');
  if(sess.viewAll){ loadRecent(); } else { showSearchPrompt(); }
}
function saveSession(sess, remember){
  try {
    if(remember){ localStorage.setItem(SESSION_KEY, JSON.stringify(sess)); sessionStorage.removeItem(SESSION_KEY); }
    else { sessionStorage.setItem(SESSION_KEY, JSON.stringify(sess)); localStorage.removeItem(SESSION_KEY); }
  } catch(e){}
}
function readSavedSession(){
  try { const l = localStorage.getItem(SESSION_KEY); if(l){ return JSON.parse(l); } } catch(e){}
  try { const s = sessionStorage.getItem(SESSION_KEY); if(s){ return JSON.parse(s); } } catch(e){}
  return null;
}
function doLogout(){
  session = null;
  try { sessionStorage.removeItem(SESSION_KEY); localStorage.removeItem(SESSION_KEY); } catch(e){}
  loginUser.value=''; loginPass.value=''; if(rememberMe) rememberMe.checked=false; clearLoginErr();
  appEl.classList.add('hide');
  loginwrap.classList.add('show');
}
async function doLogin(){
  clearLoginErr();
  const u = loginUser.value.trim();
  const pw = loginPass.value;
  if(!u || !pw){ showLoginErr('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน'); return; }
  if(pw.length < 4 || pw.length > 8){ showLoginErr('รหัสผ่านต้องมี 4-8 ตัวอักษร'); loginPass.focus(); return; }
  if(!backendConfigured()){ showLoginErr('ยังไม่ได้ตั้งค่า Backend (ดูคู่มือตั้งค่า.md)'); return; }
  loginBtn.disabled = true; loginSpinner.classList.add('show'); loginLabel.textContent='กำลังตรวจสอบ...';
  try {
    const res = await jsonp(APPS_SCRIPT_URL, { action: 'loginViewer', username: u, password: pw });
    if(res && res.success){
      const sess = { username: u, password: pw, carrier: res.carrier, viewAll: !!res.viewAll };
      saveSession(sess, rememberMe && rememberMe.checked);
      enterApp(sess);
    } else {
      showLoginErr((res && res.error) ? res.error : 'เข้าสู่ระบบไม่สำเร็จ');
    }
  } catch(err){
    showLoginErr('เชื่อมต่อไม่สำเร็จ กรุณาลองใหม่');
  } finally {
    loginBtn.disabled = false; loginSpinner.classList.remove('show'); loginLabel.textContent='เข้าสู่ระบบ';
  }
}
loginBtn.addEventListener('click', doLogin);
loginPass.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') doLogin(); });
document.getElementById('logoutBtn').addEventListener('click', doLogout);

(function restoreSession(){
  const saved = readSavedSession();
  if(saved){ enterApp(saved); }
  else { loginwrap.classList.add('show'); appEl.classList.add('hide'); }
})();

// ===== ค้นหา / แสดงผล =====
function showSearchPrompt(){
  resultsLabel.style.display = 'none';
  if(!backendConfigured()){
    searchMeta.textContent = 'ยังไม่ได้เชื่อมต่อ Backend';
    resultsArea.innerHTML = '<div class="empty"><p>ยังไม่ได้ตั้งค่า Backend</p><div class="sub">กรุณาใส่ APPS_SCRIPT_URL ในไฟล์นี้ก่อน (ดูคู่มือตั้งค่า.md)</div></div>';
    return;
  }
  searchMeta.textContent = 'พิมพ์เลขที่บิลเพื่อค้นหา';
  resultsArea.innerHTML = '<div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/><path d="M20 20L16.65 16.65" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><p>ค้นหาด้วยเลขที่บิล</p><div class="sub">พิมพ์เลขที่บิลในช่องด้านบน เพื่อดูหลักฐานการจัดส่ง</div></div>';
}

async function loadRecent(){
  if(!backendConfigured()){
    resultsArea.innerHTML = '<div class="empty"><p>ยังไม่ได้ตั้งค่า Backend</p><div class="sub">กรุณาใส่ APPS_SCRIPT_URL ในไฟล์นี้ก่อน (ดูคู่มือตั้งค่า.md)</div></div>';
    searchMeta.textContent = 'ยังไม่ได้เชื่อมต่อ Backend';
    return;
  }
  resultsArea.innerHTML = '<div class="loading"><div class="spinner"></div>กำลังโหลดข้อมูล...</div>';
  try {
    const results = await callBackend({ action: 'recent' });
    searchMeta.textContent = 'แสดงรายการล่าสุด';
    renderResults(results, 'รายการล่าสุด');
  } catch(e){
    resultsArea.innerHTML = '<div class="empty"><p>โหลดข้อมูลไม่สำเร็จ</p><div class="sub">' + escapeHtml(e.message) + '</div></div>';
  }
}
async function doSearch(query){
  resultsArea.innerHTML = '<div class="loading"><div class="spinner"></div>กำลังค้นหา...</div>';
  try {
    const results = await callBackend({ action: 'search', billNo: query });
    renderResults(results, 'พบ ' + results.length + ' รายการ');
  } catch(e){
    resultsArea.innerHTML = '<div class="empty"><p>ค้นหาไม่สำเร็จ</p><div class="sub">' + escapeHtml(e.message) + '</div></div>';
  }
}
function renderResults(matches, label){
  resultsLabel.style.display = matches.length ? 'block' : 'none';
  resultsLabel.textContent = label;
  if(matches.length === 0){
    resultsArea.innerHTML = '<div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/><path d="M20 20L16.65 16.65" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><p>ไม่พบเลขที่บิลนี้ในระบบ</p><div class="sub">ลองตรวจสอบเลขที่บิลอีกครั้ง หรืออาจยังไม่มีขนส่งแนบหลักฐานเข้ามา</div></div>';
    return;
  }
  resultsArea.innerHTML = '';
  matches.forEach(item => {
    const row = document.createElement('div');
    row.className = 'rowcard';
    row.innerHTML = '<div class="rowicon">' + (item.carrier||'?').slice(0,2).toUpperCase() + '</div>'
      + '<div class="rowmain"><div class="rowbill">' + escapeHtml(item.billNo||'-') + '</div>'
      + '<div class="rowsub">' + escapeHtml(item.carrier||'-') + ' · ' + fmtDate(item.deliveryDate) + '</div></div>'
      + '<div class="rowarrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
    row.onclick = () => openDetail(item);
    resultsArea.appendChild(row);
  });
}

searchInput.addEventListener('input', () => {
  clearBtn.classList.toggle('show', searchInput.value.length > 0);
  clearTimeout(debounceTimer);
  const q = searchInput.value.trim();
  debounceTimer = setTimeout(() => { if(q === ''){ (session && session.viewAll) ? loadRecent() : showSearchPrompt(); } else { doSearch(q); } }, 350);
});
clearBtn.addEventListener('click', () => { searchInput.value=''; clearBtn.classList.remove('show'); (session && session.viewAll) ? loadRecent() : showSearchPrompt(); searchInput.focus(); });

const overlay = document.getElementById('overlay');
const modalBill = document.getElementById('modalBill');
const modalGrid = document.getElementById('modalGrid');
const detailRows = document.getElementById('detailRows');
const noteBox = document.getElementById('noteBox');
const noteText = document.getElementById('noteText');

function openDetail(item){
  overlay.classList.add('show');
  modalBill.textContent = item.billNo || '-';
  noteBox.style.display = 'none';
  currentImages = item.images || [];
  modalGrid.innerHTML = '';
  if(currentImages.length === 0){
    modalGrid.innerHTML = '<div class="empty" style="grid-column:1/-1;">ไม่พบรูปภาพสำหรับรายการนี้</div>';
  } else {
    currentImages.forEach((src, i) => {
      const img = document.createElement('img'); img.src = src; img.loading='lazy';
      img.onclick = () => openLightbox(i); modalGrid.appendChild(img);
    });
  }
  detailRows.innerHTML = '<div class="drow"><div class="k">ขนส่ง</div><div class="v">' + escapeHtml(item.carrier||'-') + '</div></div>'
    + '<div class="drow"><div class="k">เลขที่บิล</div><div class="v">' + escapeHtml(item.billNo||'-') + '</div></div>'
    + '<div class="drow"><div class="k">วันที่ส่งงาน</div><div class="v">' + fmtDate(item.deliveryDate) + '</div></div>'
    + '<div class="drow"><div class="k">เวลาที่แนบเข้าระบบ</div><div class="v">' + fmtDateTime(item.timestamp) + '</div></div>';
  if(item.note){ noteBox.style.display='block'; noteText.textContent = item.note; }
}

document.getElementById('closeModal').onclick = () => overlay.classList.remove('show');
overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.classList.remove('show'); });

const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbViewport = document.getElementById('lbViewport');
const lbCount = document.getElementById('lbCount');
const lbDownload = document.getElementById('lbDownload');

// สถานะ zoom/pan
let zScale = 1, zX = 0, zY = 0;
const Z_MIN = 1, Z_MAX = 5;

function applyTransform(){
  lbImg.style.transform = 'translate(' + zX + 'px,' + zY + 'px) scale(' + zScale + ')';
  lbImg.classList.toggle('zoomed', zScale > 1.01);
  lbImg.classList.toggle('zoomable', zScale <= 1.01);
}
function resetZoom(){ zScale = 1; zX = 0; zY = 0; applyTransform(); }

// จำกัดการเลื่อน (pan) ไม่ให้รูปหลุดขอบมากเกินไป
function clampPan(){
  const vp = lbViewport.getBoundingClientRect();
  const iw = lbImg.clientWidth * zScale, ih = lbImg.clientHeight * zScale;
  const maxX = Math.max(0, (iw - vp.width) / 2);
  const maxY = Math.max(0, (ih - vp.height) / 2);
  zX = Math.max(-maxX, Math.min(maxX, zX));
  zY = Math.max(-maxY, Math.min(maxY, zY));
}

function zoomAt(factor, cx, cy){
  const prev = zScale;
  zScale = Math.max(Z_MIN, Math.min(Z_MAX, zScale * factor));
  if(zScale === prev) return;
  if(zScale <= 1.01){ resetZoom(); return; }
  // ซูมโดยอิงจุดที่ผู้ใช้แตะ/คลิก (ให้จุดนั้นอยู่กับที่)
  const vp = lbViewport.getBoundingClientRect();
  const ox = (cx - vp.left - vp.width/2 - zX);
  const oy = (cy - vp.top - vp.height/2 - zY);
  const ratio = zScale / prev;
  zX -= ox * (ratio - 1);
  zY -= oy * (ratio - 1);
  clampPan(); applyTransform();
}

function openLightbox(idx){ currentImgIdx = idx; updateLightbox(); lightbox.classList.add('show'); }
function updateLightbox(){
  lbImg.src = currentImages[currentImgIdx];
  lbDownload.href = currentImages[currentImgIdx];
  lbCount.textContent = (currentImgIdx+1) + ' / ' + currentImages.length;
  resetZoom();
}
document.getElementById('lbPrev').onclick = (e) => { e.stopPropagation(); currentImgIdx = (currentImgIdx-1+currentImages.length)%currentImages.length; updateLightbox(); };
document.getElementById('lbNext').onclick = (e) => { e.stopPropagation(); currentImgIdx = (currentImgIdx+1)%currentImages.length; updateLightbox(); };
document.getElementById('lbClose').onclick = () => lightbox.classList.remove('show');

// ปุ่มซูม (อิงกึ่งกลางจอ)
document.getElementById('lbZoomIn').onclick = (e) => { e.stopPropagation(); const r=lbViewport.getBoundingClientRect(); zoomAt(1.4, r.left+r.width/2, r.top+r.height/2); };
document.getElementById('lbZoomOut').onclick = (e) => { e.stopPropagation(); const r=lbViewport.getBoundingClientRect(); zoomAt(1/1.4, r.left+r.width/2, r.top+r.height/2); };

// ปิดเมื่อกดพื้นหลังนอกรูป (เฉพาะตอนไม่ได้ซูม)
lbViewport.addEventListener('click', (e) => { if(e.target === lbViewport && zScale <= 1.01) lightbox.classList.remove('show'); });

// ---- Desktop: ดับเบิลคลิกสลับซูม, ล้อเมาส์ซูม, ลากเลื่อน ----
lbImg.addEventListener('dblclick', (e) => { e.preventDefault(); zScale > 1.01 ? resetZoom() : zoomAt(2.2, e.clientX, e.clientY); });
lbViewport.addEventListener('wheel', (e) => { e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.15 : 1/1.15, e.clientX, e.clientY); }, {passive:false});

let dragging=false, dragSX=0, dragSY=0, dragOX=0, dragOY=0;
lbImg.addEventListener('mousedown', (e) => { if(zScale<=1.01) return; e.preventDefault(); dragging=true; dragSX=e.clientX; dragSY=e.clientY; dragOX=zX; dragOY=zY; lbImg.classList.add('grabbing'); });
window.addEventListener('mousemove', (e) => { if(!dragging) return; zX=dragOX+(e.clientX-dragSX); zY=dragOY+(e.clientY-dragSY); clampPan(); applyTransform(); });
window.addEventListener('mouseup', () => { dragging=false; lbImg.classList.remove('grabbing'); });

// ---- Mobile: pinch ซูม, แตะสองครั้งสลับซูม, ลากนิ้วเลื่อน ----
let touchMode=null, startDist=0, startScale=1, tStartX=0, tStartY=0, tOX=0, tOY=0, lastTap=0;
function dist(t){ const dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.hypot(dx,dy); }
function mid(t){ return { x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2 }; }

lbViewport.addEventListener('touchstart', (e) => {
  if(e.touches.length === 2){
    touchMode='pinch'; startDist=dist(e.touches); startScale=zScale;
  } else if(e.touches.length === 1){
    // ตรวจดับเบิลแท็บ
    const now=Date.now();
    if(now - lastTap < 300){
      const t=e.touches[0];
      zScale > 1.01 ? resetZoom() : zoomAt(2.4, t.clientX, t.clientY);
      touchMode=null; lastTap=0; return;
    }
    lastTap=now;
    if(zScale > 1.01){ touchMode='pan'; tStartX=e.touches[0].clientX; tStartY=e.touches[0].clientY; tOX=zX; tOY=zY; }
    else { touchMode=null; }
  }
}, {passive:false});

lbViewport.addEventListener('touchmove', (e) => {
  if(touchMode==='pinch' && e.touches.length===2){
    e.preventDefault();
    const m=mid(e.touches);
    const target=startScale * (dist(e.touches)/startDist);
    const factor=target/zScale;
    zoomAt(factor, m.x, m.y);
  } else if(touchMode==='pan' && e.touches.length===1){
    e.preventDefault();
    zX=tOX+(e.touches[0].clientX-tStartX); zY=tOY+(e.touches[0].clientY-tStartY);
    clampPan(); applyTransform();
  }
}, {passive:false});

lbViewport.addEventListener('touchend', (e) => { if(e.touches.length===0) touchMode=null; });

lightbox.addEventListener('click', (e) => { if(e.target === lightbox) lightbox.classList.remove('show'); });
</script>
